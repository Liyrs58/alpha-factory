name: assemble-lockfile
on:
  push:
    paths:
      - "_lock_parts/**"
      - ".github/workflows/assemble-lockfile.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write complete package-lock.json
        run: |
          python3 - <<'PY'
          import base64, json, pathlib
          parts = sorted(pathlib.Path("_lock_parts").glob("p*.b64"))
          b64 = "".join(p.read_text().strip() for p in parts)
          data = base64.b64decode(b64)
          pathlib.Path("package-lock.json").write_bytes(data)
          obj = json.loads(data)
          n = len(obj.get("packages", {}))
          assert n >= 400, n
          assert "node_modules/@next/swc-linux-x64-gnu" in obj["packages"]
          assert "node_modules/next" in obj["packages"]
          print("packages", n, "bytes", len(data))
          PY
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Replace truncated lockfile with complete npm lock (368 packages)"
          git push
